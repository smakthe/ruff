[package]
name = "ruff"
version = "0.1.0"
edition = "2024"
authors = ["Somak Chakraborty <scmakra99@gmail.com>"]
description = "A terminal-based AI chat application with multiple model support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/ruff"
keywords = ["ai", "chat", "terminal", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "ruff"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.28"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"
confy = "0.6"
colored = "2.1"
uuid = { version = "1.10", features = ["serde", "v4"] }
directories = "5.0"

[dev-dependencies]
tokio-test = "0.4"
